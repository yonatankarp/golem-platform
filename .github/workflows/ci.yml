name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # The pins live in controller-requirements.txt alone, so Renovate bumps
      # the one place CI and golem both read.
      - name: Install Ansible tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -r controller-requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r requirements.yml -p .collections

      # ansible.cfg names golem's vault password file, which a runner does not
      # have. Nothing here decrypts a vault: the vault files exist only on golem.
      - name: Stand in for golem's vault password file
        run: |
          echo ci > "$RUNNER_TEMP/vault-password"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault-password" >> "$GITHUB_ENV"

      - name: Check playbook syntax
        run: ansible-playbook site.yml --syntax-check

      - name: Lint Ansible
        run: ansible-lint --strict

  discord-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Test the bot's logic
        run: python3 roles/discord_bot/files/test_bot.py
