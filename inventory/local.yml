all:
  hosts:
    golem:
      # Ansible runs on golem itself: the per-service vault files exist only
      # there (group_vars/all/vault_*.yml, gitignored), never in git.
      ansible_connection: local
  vars:
    admin_user: yonatan
    lan_cidr: 192.168.0.0/24
    # The router: golem's only resolver, which dhcpcd writes to /etc/resolv.conf
    # (the tailscale role sets --accept-dns=false); the agent may reach it on
    # 53 only.
    lan_resolver: 192.168.0.1
    agent_user: agent
    # The agent must never starve Foundry: 8 GB RAM, 4 threads in total.
    agent_memory_max: 3G
    agent_cpu_quota: 200%
    # GitHub Actions runners for private repositories, each registered to one
    # repository (owner/name) or a whole organisation (name). Capped like the
    # agent; the cap covers their rootless Docker and every job container. Up to
    # three threads while golem is idle, but at a low CPU weight, so Foundry and
    # the agent win whenever they want the CPU. One the-stack gate peaked at the
    # old 2G cap (2026-11-06), so two side by side get 3G.
    github_runner_user: runner
    github_runner_memory_max: 3G
    github_runner_cpu_quota: 300%
    github_runner_cpu_weight: 20
    # More than one runner for a target, so its jobs don't queue behind each other.
    github_runner_instances:
      yonatankarp/the-stack: 2
    github_runner_targets:
      - yonatankarp/before-dark
      - yonatankarp/the-stack
      - guillotine-mods
    # The NAS's tailnet IP, not its MagicDNS name: golem resolves through the
    # router, so neither golem nor its containers can resolve *.ts.net.
    nas_tailnet_address: 100.102.136.50
    beszel_hub_url: "http://{{ nas_tailnet_address }}:8090"
    # Where the NAS's Dozzle dials golem's Dozzle agent: golem's tailnet IP,
    # never 0.0.0.0, because ufw does not filter Docker-published ports. An IP
    # rather than a name for the same reason as beszel_hub_url.
    dozzle_agent_address: 100.104.25.70:7007
    # The NAS's alert relay, which pages Pushover; the port is nas-platform's
    # dozzle_alert_relay_port, reached through the NAS's Tailscale Serve forward.
    dozzle_alert_relay_url: "http://{{ nas_tailnet_address }}:8081/alerts"
    foundry_hostname: dnd.yonatankarp.com
    # Fixed so the firewall can tell Foundry's traffic apart (hardening's
    # golem-foundry-egress). Outside Docker's default pools (172.17-31/16,
    # 192.168/16), so no other network can be handed it.
    foundry_subnet: 10.99.0.0/24
    lorekeeper_sync_hostname: lorekeeper.yonatankarp.com
    # Fixed for hardening's golem-lorekeeper-egress, like foundry_subnet, and
    # outside Docker's default pools for the same reason.
    lorekeeper_sync_subnet: 10.99.1.0/24
