all:
  hosts:
    golem:
      # Ansible runs on golem itself: the per-service vault files exist only
      # there (group_vars/all/vault_*.yml, gitignored), never in git.
      ansible_connection: local
  vars:
    admin_user: yonatan
    lan_cidr: 192.168.0.0/24
    agent_user: agent
    # The agent must never starve Foundry: 8 GB RAM, 4 threads in total.
    agent_memory_max: 3G
    agent_cpu_quota: 200%
    # The NAS's tailnet IP, not its MagicDNS name: golem's resolver is the
    # router, so containers on a Compose network cannot resolve *.ts.net.
    beszel_hub_url: http://100.102.136.50:8090
    foundry_hostname: dnd.yonatankarp.com
