- name: Read the admin's authorized keys
  ansible.builtin.stat:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
  register: hardening_admin_keys

# Turning passwords off without a key in place is a lockout, and the only way
# back is the physical console.
- name: Refuse to disable password login without an authorized key
  ansible.builtin.assert:
    that: hardening_admin_keys.stat.exists and hardening_admin_keys.stat.size > 0
    fail_msg: "/home/{{ admin_user }}/.ssh/authorized_keys is missing or empty"

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Debian's sshd_config includes sshd_config.d first and the first value wins,
# so this drop-in outranks the stock file. AllowTcpForwarding stays at its
# default (yes): an editor's remote-SSH session tunnels through it.
- name: Restrict SSH to key login by the admin
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-golem.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ admin_user }}
      X11Forwarding no
      AllowAgentForwarding no
    mode: "0644"
  notify: Reload ssh

- name: Validate the SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false

# Docker-published ports bypass these rules entirely, so containers publish
# nothing except onto the tailnet address.
- name: Allow SSH from the LAN
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ lan_cidr }}"

- name: Allow everything arriving over Tailscale
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Deny other inbound traffic and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Create the agent user
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: /bin/bash
    groups: []
    append: false
  register: hardening_agent

# The agent has no sudo and is kept out of the docker group, which is root in
# all but name. Its cap is a slice of its own rather than user-<uid>.slice:
# `sudo -iu agent` opens no logind session and lands in the caller's slice
# (measured: user-1000.slice), and a system unit with User=agent lands in
# system.slice. So every agent process is started with Slice=agent.slice,
# interactively through agent-shell and unattended through its units.
- name: Remove the ineffective per-user slice cap
  ansible.builtin.file:
    path: "/etc/systemd/system/user-{{ hardening_agent.uid }}.slice.d"
    state: absent
  when: hardening_agent.uid is defined
  notify: Reload systemd

- name: Define the agent's slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent.slice
    content: |
      [Unit]
      Description=Claude Code agent (capped so it cannot starve Foundry)

      [Slice]
      MemoryMax={{ agent_memory_max }}
      CPUQuota={{ agent_cpu_quota }}
    mode: "0644"
  notify: Reload systemd

- name: Install agent-shell, an interactive login as the agent inside its slice
  ansible.builtin.copy:
    dest: /usr/local/sbin/agent-shell
    content: |
      #!/bin/sh
      exec systemd-run --quiet --uid={{ agent_user }} --slice=agent.slice \
        --working-directory=/home/{{ agent_user }} --pty --wait --collect \
        /bin/bash -l
    mode: "0755"

# The agent acts on whatever a Discord message talks it into, so it is kept off
# everything private: as the agent, golem reached both socket-proxies
# (172.19.0.3:2375 and 172.21.0.2:2375, i.e. every container's environment),
# the NAS's tailnet services and the router (measured 2026-10-06). It needs the
# internet and DNS, nothing more. The resolver is not fixed: tailscaled and
# dhcpcd take turns writing /etc/resolv.conf (tailscaled logged it trampled 13
# times on 2026-10-06), so DNS stays open to Tailscale's 100.100.100.100 and
# fd7a:115c:a1e0::53 and to the router. REJECT, so a blocked tool fails at
# once. After the loopback and ESTABLISHED accepts, so only new connections
# are judged; fc00::/7 covers the tailnet's fd7a:115c:a1e0::/48. The owner
# match needs the user, hence after creating it.
- name: Keep the agent off the LAN, the tailnet and Docker's networks
  ansible.builtin.blockinfile:
    path: "/etc/ufw/{{ item.file }}"
    marker: "# {mark} golem agent egress"
    insertafter: "^-A {{ item.chain }} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT$"
    block: |
      :golem-agent-egress - [0:0]
      -A {{ item.chain }} -m owner --uid-owner {{ agent_user }} -m conntrack --ctstate NEW -d {{ item.private }} -j golem-agent-egress
      -A golem-agent-egress -p udp --dport 53 -d {{ item.resolvers }} -j RETURN
      -A golem-agent-egress -p tcp --dport 53 -d {{ item.resolvers }} -j RETURN
      -A golem-agent-egress -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[golem-agent-egress] "
      -A golem-agent-egress -j REJECT
    validate: "/usr/sbin/{{ item.restore }} --noflush --test %s"
  loop:
    - file: before.rules
      chain: ufw-before-output
      private: "{{ hardening_private_ipv4 }}"
      resolvers: "100.100.100.100,{{ lan_resolver }}"
      restore: iptables-restore
    - file: before6.rules
      chain: ufw6-before-output
      private: fc00::/7,fe80::/10
      resolvers: fd7a:115c:a1e0::53
      restore: ip6tables-restore
  loop_control:
    label: "{{ item.file }}"
  notify: Reload ufw

# Foundry is the one workload the internet reaches, and its traffic leaves
# through the host: from its namespace the NAS (100.102.136.50:443 and :8090),
# the router and the Dozzle agent's published port all answered (measured
# 2026-10-06). It needs the internet only; its DNS goes through dockerd's
# resolver, which forwards from the host's namespace, not from this subnet.
# Not in DOCKER-USER: filter FORWARD runs ts-forward first whenever tailscaled
# started after dockerd (as it has since its 2026-10-06 upgrade), and
# ts-forward accepts everything leaving on tailscale0, the NAS included.
# mangle FORWARD runs before any filter rule and after DNAT, so a published
# port is judged by the container it leads to. Neither Docker nor Tailscale
# writes to it, so it is flushed here, or each ufw reload would add a jump.
- name: Keep Foundry off the LAN, the tailnet and Docker's networks
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} golem foundry egress"
    block: |
      *mangle
      :golem-foundry-egress - [0:0]
      -F FORWARD
      -A FORWARD -s {{ foundry_subnet }} -m conntrack --ctstate NEW -d {{ hardening_private_ipv4 }} -j golem-foundry-egress
      -A golem-foundry-egress -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[golem-foundry-egress] "
      -A golem-foundry-egress -j DROP
      COMMIT
    validate: /usr/sbin/iptables-restore --noflush --test %s
  notify: Reload ufw
