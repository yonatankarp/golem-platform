- name: Read the admin's authorized keys
  ansible.builtin.stat:
    path: "/home/{{ admin_user }}/.ssh/authorized_keys"
  register: hardening_admin_keys

# Turning passwords off without a key in place is a lockout, and the only way
# back is the physical console.
- name: Refuse to disable password login without an authorized key
  ansible.builtin.assert:
    that: hardening_admin_keys.stat.exists and hardening_admin_keys.stat.size > 0
    fail_msg: "/home/{{ admin_user }}/.ssh/authorized_keys is missing or empty"

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Debian's sshd_config includes sshd_config.d first and the first value wins,
# so this drop-in outranks the stock file.
- name: Restrict SSH to key login by the admin
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-golem.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers {{ admin_user }}
    mode: "0644"
  notify: Reload ssh

- name: Validate the SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false

# Docker-published ports bypass these rules entirely, so containers publish
# nothing except onto the tailnet address.
- name: Allow SSH from the LAN
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ lan_cidr }}"

- name: Allow everything arriving over Tailscale
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Deny other inbound traffic and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Create the agent user
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: /bin/bash
    groups: []
    append: false
  register: hardening_agent

# The agent has no sudo and is kept out of the docker group, which is root in
# all but name. Its cap is a slice of its own rather than user-<uid>.slice:
# `sudo -iu agent` opens no logind session and lands in the caller's slice
# (measured: user-1000.slice), and a system unit with User=agent lands in
# system.slice. So every agent process is started with Slice=agent.slice,
# interactively through agent-shell and unattended through its units.
- name: Remove the ineffective per-user slice cap
  ansible.builtin.file:
    path: "/etc/systemd/system/user-{{ hardening_agent.uid }}.slice.d"
    state: absent
  when: hardening_agent.uid is defined
  notify: Reload systemd

- name: Define the agent's slice
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent.slice
    content: |
      [Unit]
      Description=Claude Code agent (capped so it cannot starve Foundry)

      [Slice]
      MemoryMax={{ agent_memory_max }}
      CPUQuota={{ agent_cpu_quota }}
    mode: "0644"
  notify: Reload systemd

- name: Install agent-shell, an interactive login as the agent inside its slice
  ansible.builtin.copy:
    dest: /usr/local/sbin/agent-shell
    content: |
      #!/bin/sh
      exec systemd-run --quiet --uid={{ agent_user }} --slice=agent.slice \
        --working-directory=/home/{{ agent_user }} --pty --wait --collect \
        /bin/bash -l
    mode: "0755"
