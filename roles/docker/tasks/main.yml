- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

# Rotated logs so a chatty container cannot fill the 500 GB disk; live-restore
# keeps containers running through a daemon upgrade by unattended-upgrades.
- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"},
        "live-restore": true
      }
    mode: "0644"
  notify: Restart docker

# dhcpcd writes /etc/resolv.conf only once it holds a lease, and Docker can start
# before that: on the 2026-10-02 04:00 automatic reboot it started 8 s in, gave
# five containers an embedded resolver with no upstream, and they kept it until
# recreated -- cloudflared crash-looped all night on "server misbehaving". The
# resolver forwards from the host's namespace, so any nameserver will do: wait
# for one, and start anyway after 90 s rather than hold Docker down on a dead
# network.
- name: Create Docker's systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Start Docker only once the host has a nameserver
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/wait-for-dns.conf
    content: |
      [Service]
      ExecStartPre=-/usr/bin/timeout 90 /bin/sh -c 'until grep -q "^nameserver " /etc/resolv.conf; do sleep 1; done'
    mode: "0644"
  notify: Reload systemd

- name: Let unattended-upgrades update Docker
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53golem-docker
    content: |
      Unattended-Upgrade::Origins-Pattern { "origin=Docker"; };
    mode: "0644"

# Both cloudflareds join their server's network namespace (network_mode:
# service:), which Docker binds once, at start. A restarted server gets a new
# namespace and leaves cloudflared in the old one, with no route out:
# lorekeeper.yonatankarp.com 502'd that way on 2026-10-07. Their depends_on
# restart: true covers restarts Compose makes, but not Docker's own after a
# crash or the memory cap, nor a `stop` then `start` of the server alone. This
# restarts any such container within a minute. It compares namespaces rather
# than health, so a Cloudflare outage restarts nothing.
- name: Install the shared network namespace watchdog
  ansible.builtin.copy:
    src: rejoin-shared-netns
    dest: /usr/local/sbin/rejoin-shared-netns
    mode: "0755"

- name: Define the shared network namespace watchdog
  ansible.builtin.copy:
    dest: "/etc/systemd/system/rejoin-shared-netns.{{ item.unit }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - unit: service
      content: |
        [Unit]
        Description=Restart containers left outside the network namespace they joined
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/rejoin-shared-netns
    - unit: timer
      content: |
        [Unit]
        Description=Check every minute for containers left outside their shared network namespace

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.unit }}"
  notify: Reload systemd

- name: Enable the shared network namespace watchdog
  ansible.builtin.systemd_service:
    name: rejoin-shared-netns.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
