- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Cancels a job in progress: it reruns on the next container.
- name: Restart the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item | replace('/', '-') }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ github_runner_targets }}"
