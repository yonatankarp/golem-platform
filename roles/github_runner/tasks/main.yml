# A fine-grained PAT is scoped to one account or organisation, so each owner in
# github_runner_targets needs its own; a template value saved unedited must not
# deploy, as with every other vault here.
- name: Refuse missing or placeholder GitHub runner tokens
  ansible.builtin.assert:
    that:
      - vault_github_runner_tokens[item.split('/')[0]] is defined
      - vault_github_runner_tokens[item.split('/')[0]] is match('^github_pat_[A-Za-z0-9_]{60,}$')
    fail_msg: >-
      group_vars/all/vault_github_runner.yml has no fine-grained token
      (github_pat_...) under {{ item.split('/')[0] }}, which {{ item }} needs.
    quiet: true
  loop: "{{ github_runner_targets }}"
  no_log: true

# A fork's pull request runs the workflow file from the fork, so it can ask for
# runs-on: golem; only a runner group closed to public repositories stops that
# on an organisation with public repositories (guillotine-mods has two).
- name: Read each organisation's runner groups
  ansible.builtin.uri:
    url: "https://api.github.com/orgs/{{ item }}/actions/runner-groups"
    headers:
      Authorization: "Bearer {{ vault_github_runner_tokens[item] }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
  loop: "{{ github_runner_targets | reject('search', '/') | list }}"
  register: github_runner_groups
  no_log: true

- name: Refuse an organisation whose runners public repositories may use
  ansible.builtin.assert:
    that: item.json.runner_groups | selectattr('allows_public_repositories') | list | length == 0
    fail_msg: >-
      {{ item.item }} lets public repositories use its runners: turn off
      "Allow public repositories" in Settings > Actions > Runner groups.
    quiet: true
  loop: "{{ github_runner_groups.results }}"
  loop_control:
    label: "{{ item.item }}"

# uidmap and slirp4netns are rootless Docker's (docker-ce-rootless-extras comes
# with docker-ce); curl and jq turn the PAT into registration tokens. Jobs bring
# their own tools: they run in the runner image.
- name: Install rootless Docker's dependencies
  ansible.builtin.apt:
    name:
      - uidmap
      - slirp4netns
      - docker-ce-rootless-extras
      - curl
      - jq
    state: present

- name: Look up the runner user
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Name the runner user's home and runtime directory
  ansible.builtin.set_fact:
    github_runner_uid: "{{ ansible_facts.getent_passwd[github_runner_user][1] }}"
    github_runner_home: "{{ ansible_facts.getent_passwd[github_runner_user][4] }}"
    github_runner_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[github_runner_user][1] }}"

# The runner containers and everything a job starts run under rootless Docker,
# a service of the user's lingering systemd manager, so in user-<uid>.slice:
# the one place a cap catches all of it.
- name: Create the runner user's slice drop-in directory
  ansible.builtin.file:
    path: "/etc/systemd/system/user-{{ github_runner_uid }}.slice.d"
    state: directory
    mode: "0755"

- name: Cap the runners so CI cannot starve Foundry
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user-{{ github_runner_uid }}.slice.d/10-golem-cap.conf"
    content: |
      [Slice]
      MemoryMax={{ github_runner_memory_max }}
      CPUQuota={{ github_runner_cpu_quota }}
    mode: "0644"
  notify: Reload systemd

- name: Keep the runner user's systemd manager running without a login
  ansible.builtin.command: loginctl enable-linger {{ github_runner_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ github_runner_user }}"

- name: Start the runner user's systemd manager
  ansible.builtin.systemd_service:
    name: "user@{{ github_runner_uid }}.service"
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

# Its own daemon and image store under the runner's home: the pull cache that
# outlives every job. Installs and starts docker.service as a user unit.
# Rootful Docker's socket is root-only, so the tool does not refuse.
- name: Set up rootless Docker for the runner user
  ansible.builtin.command: dockerd-rootless-setuptool.sh install
  args:
    creates: "{{ github_runner_home }}/.config/systemd/user/docker.service"
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ github_runner_runtime_dir }}"
  ignore_errors: "{{ ansible_check_mode }}"

# until= is creation time, not last use, so a busy image is re-pulled every
# github_runner_prune_after: one pull a fortnight, against a disk that fills.
# The runner image itself is spared: between two jobs no container uses it.
- name: Define the image-pruning user units
  ansible.builtin.copy:
    dest: "/etc/systemd/user/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: github-runner-prune.service
      content: |
        [Unit]
        Description=Prune the runners' Docker images and build cache
        Requires=docker.service
        After=docker.service

        [Service]
        Type=oneshot
        Environment=DOCKER_HOST=unix://%t/docker.sock
        ExecStart=/usr/bin/docker system prune --all --force --filter until={{ github_runner_prune_after }} --filter label!=golem.github-runner
    - name: github-runner-prune.timer
      content: |
        [Unit]
        Description=Prune the runners' Docker cache daily

        [Timer]
        OnCalendar=daily
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Start the pruning timer
  ansible.builtin.systemd_service:
    name: github-runner-prune.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ github_runner_runtime_dir }}"
  ignore_errors: "{{ ansible_check_mode }}"

# Root-only: a job can mount anything the runner user can read into a container.
- name: Create the runner configuration directory
  ansible.builtin.file:
    path: /etc/github-runner
    state: directory
    mode: "0700"

- name: Render the PAT for each owner
  ansible.builtin.copy:
    dest: "/etc/github-runner/pat-{{ item }}"
    content: "{{ vault_github_runner_tokens[item] }}"
    mode: "0600"
  loop: "{{ github_runner_targets | map('split', '/') | map('first') | unique | list }}"
  no_log: true

- name: Name each runner's target
  ansible.builtin.copy:
    dest: "/etc/github-runner/{{ item | replace('/', '-') }}.target"
    content: "{{ item }}"
    mode: "0600"
  loop: "{{ github_runner_targets }}"

- name: Install the registration token helper
  ansible.builtin.copy:
    src: github-runner-token
    dest: /usr/local/sbin/github-runner-token
    mode: "0755"

- name: Create the runner image's build context
  ansible.builtin.file:
    path: /etc/github-runner/image
    state: directory
    mode: "0700"

- name: Copy the runner image's build context
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/github-runner/image/{{ item.src }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: Dockerfile, mode: "0644"}
    - {src: entrypoint.sh, mode: "0755"}
  loop_control:
    label: "{{ item.src }}"

# Tagged by its inputs, so a change to either builds a new image and the units
# move to it; an unchanged one is not rebuilt.
- name: Name the runner image
  ansible.builtin.set_fact:
    github_runner_image: >-
      github-runner:{{ (lookup('file', 'Dockerfile') ~ lookup('file', 'entrypoint.sh')) | hash('sha256') | truncate(12, true, '') }}

- name: Build the runner image in rootless Docker
  community.docker.docker_image_build:
    name: "{{ github_runner_image.split(':')[0] }}"
    tag: "{{ github_runner_image.split(':')[1] }}"
    path: /etc/github-runner/image
    docker_host: "unix://{{ github_runner_runtime_dir }}/docker.sock"
    rebuild: never
  ignore_errors: "{{ ansible_check_mode }}"

# One container per job: it registers, takes a job, exits, and --rm discards it
# with the job's workspace; Restart= starts the next from a clean image. The
# + step runs as root, so only a one-hour registration token reaches the
# runner. The container runs as its root, which rootless Docker maps to the
# runner user: the one uid that may use the Docker socket jobs are given. Paths
# inside it are not the daemon's, so a job's `docker run -v $PWD:...` mounts
# nothing useful (container: jobs and services are unaffected only if they mount
# no workspace).
- name: Define the runner service
  ansible.builtin.copy:
    dest: /etc/systemd/system/github-runner@.service
    content: |
      [Unit]
      Description=Ephemeral GitHub Actions runner for %i
      Wants=network-online.target
      After=network-online.target user@{{ github_runner_uid }}.service
      Requires=user@{{ github_runner_uid }}.service

      [Service]
      User={{ github_runner_user }}
      RuntimeDirectory=github-runner/%i
      RuntimeDirectoryMode=0700
      Environment=DOCKER_HOST=unix://{{ github_runner_runtime_dir }}/docker.sock
      ExecStartPre=+/usr/local/sbin/github-runner-token %i {{ github_runner_user }}
      ExecStartPre=-/usr/bin/docker rm -f github-runner-%i
      ExecStart=/usr/bin/docker run --rm --name github-runner-%i --pull never \
        --user 0 -e RUNNER_ALLOW_RUNASROOT=1 \
        -e RUNNER_TOOL_CACHE=/opt/hostedtoolcache \
        --env-file /run/github-runner/%i/env \
        -v {{ github_runner_runtime_dir }}/docker.sock:/var/run/docker.sock \
        -v github-runner-toolcache:/opt/hostedtoolcache \
        {{ github_runner_image }}
      Restart=always
      RestartSec=5
      TimeoutStopSec=30

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart the runners

- name: Start the runners
  ansible.builtin.systemd_service:
    name: "github-runner@{{ item | replace('/', '-') }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ github_runner_targets }}"
  ignore_errors: "{{ ansible_check_mode }}"
