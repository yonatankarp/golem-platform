argument_specs:
  main:
    short_description: Ephemeral GitHub Actions runner containers for private repositories, under rootless Docker
    options:
      github_runner_user:
        type: str
        required: true
        description: Created by hardening, which also keeps it off the LAN and the tailnet.
      github_runner_targets:
        type: list
        elements: str
        required: true
        description: owner/name registers a runner to one repository, a bare name to a whole organisation.
      github_runner_memory_max:
        type: str
        required: true
      github_runner_cpu_quota:
        type: str
        required: true
      github_runner_cpu_weight:
        type: int
        description: The runners' share of the CPU against other slices when it is contended (systemd's default is 100).
      github_runner_max:
        type: int
        required: true
        description: Runner containers at once, shared by every target as their queues need.
      github_runner_warm:
        type: dict
        description: >-
          Idle runners to keep ready per target, so its next job starts at once; given up when another target needs the slot.
          A count for its plain golem runners, or one per extra label ({golem-pr: 1}).
      github_runner_target_max:
        type: dict
        description: The most runners one target may hold at once, below github_runner_max, so its heavy jobs leave slots (and CPU) for the others.
      github_runner_label_max:
        type: dict
        description: >-
          Per target, the most runners with each extra label (a job's runs-on beside golem) it may hold, within its own cap,
          so one label's slots stay kept for it even when it has nothing queued.
      github_runner_target_share:
        type: float
        description: The share of github_runner_max a target not in github_runner_target_max may hold, rounded down, at least one.
      github_runner_prune_after:
        type: str
      vault_github_runner_tokens:
        type: dict
        required: true
        no_log: true
        description: A fine-grained PAT per account or organisation in github_runner_targets, keyed by its name.
