- name: Look up the runner user
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Name the rootless Docker socket and the runner units
  ansible.builtin.set_fact:
    github_runner_monitoring_socket: "/run/user/{{ ansible_facts.getent_passwd[github_runner_user][1] }}/docker.sock"
    github_runner_monitoring_units: >-
      {{ github_runner_targets | map('replace', '/', '-') | map('regex_replace', '^(.*)$', 'github-runner@\1.service') | join(' ') }}

- name: Create the runner monitoring directory
  ansible.builtin.file:
    path: /srv/runner-monitoring
    state: directory
    mode: "0700"

- name: Render the runner monitoring stack
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/runner-monitoring/compose.yml
    mode: "0644"

- name: Deploy the runner monitoring stack
  community.docker.docker_compose_v2:
    project_src: /srv/runner-monitoring
    state: present
    wait: true

# A job whose runner has stopped listening waits in GitHub's queue, for up to a
# day, rather than failing, so nothing else reports it.
- name: Install the runner pager
  ansible.builtin.copy:
    src: page-github-runners
    dest: /usr/local/sbin/page-github-runners
    mode: "0755"

- name: Define the runner pager
  ansible.builtin.copy:
    dest: "/etc/systemd/system/page-github-runners.{{ item.unit }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - unit: service
      content: |
        [Unit]
        Description=Page GitHub runners that have stopped listening for jobs

        [Service]
        Type=oneshot
        # Survives a reboot, so a runner paged before it still gets its Recovery.
        StateDirectory=page-github-runners
        StateDirectoryMode=0700
        ExecStart=/usr/local/sbin/page-github-runners {{ dozzle_alert_relay_url }} {{ github_runner_user }} {{ github_runner_monitoring_units }}
    - unit: timer
      content: |
        [Unit]
        Description=Check every minute that the GitHub runners are listening for jobs

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.unit }}"
  notify: Reload systemd

- name: Enable the runner pager
  ansible.builtin.systemd_service:
    name: page-github-runners.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
