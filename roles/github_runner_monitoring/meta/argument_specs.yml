argument_specs:
  main:
    short_description: Runner logs in the NAS's Dozzle, and pages when a GitHub runner stops listening
    description: >-
      Runs after github_runner, which creates the rootless socket the Dozzle
      agent reads, and after monitoring, whose mTLS pair and relay header it
      reuses.
    options:
      github_runner_user:
        type: str
        required: true
      github_runner_units:
        type: list
        elements: dict
        required: true
        description: Set by the github_runner role, which must run first.
      github_runner_dozzle_agent_address:
        type: str
        required: true
        description: host:port the runners' Dozzle agent publishes on; golem's tailnet address.
      dozzle_alert_relay_url:
        type: str
        required: true
      vault_dozzle_agent_certificate:
        type: str
        required: true
