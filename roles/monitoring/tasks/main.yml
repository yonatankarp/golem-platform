# An empty or truncated paste would otherwise start the agent on Dozzle's
# built-in pair, which is public. The values themselves are never printed.
- name: Refuse placeholder Dozzle agent credentials
  ansible.builtin.assert:
    that:
      - vault_dozzle_agent_certificate is search('(?s)^\\s*-----BEGIN CERTIFICATE-----\\s.+\\s-----END CERTIFICATE-----\\s*$')
      - vault_dozzle_agent_private_key is search('(?s)^\\s*-----BEGIN (RSA |EC )?PRIVATE KEY-----\\s.+\\s-----END (RSA |EC )?PRIVATE KEY-----\\s*$')
    fail_msg: >-
      group_vars/all/vault_monitoring.yml holds a placeholder or malformed Dozzle
      agent value (both must be complete PEM blocks, BEGIN to END line).
    quiet: true
  no_log: true

- name: Refuse a placeholder alert relay token
  ansible.builtin.assert:
    that: vault_dozzle_alert_relay_token is match('^[0-9a-f]{64}\\Z')
    fail_msg: >-
      group_vars/all/vault_monitoring.yml holds a placeholder or malformed
      vault_dozzle_alert_relay_token (64 lowercase hex characters, as on the NAS).
    quiet: true
  no_log: true

- name: Create the monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /srv/monitoring
    - /srv/monitoring/beszel-agent
    - /srv/monitoring/dozzle-agent

# Where the Dozzle agent keeps the alert rules the NAS hub pushed to it; it runs
# as nobody, and the rules carry the relay's bearer token.
- name: Create the Dozzle agent's data directory
  ansible.builtin.file:
    path: /srv/monitoring/dozzle-agent/data
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0700"

- name: Render the Beszel agent's credentials
  ansible.builtin.copy:
    dest: /srv/monitoring/.env
    content: |
      KEY={{ vault_beszel_agent_key }}
      TOKEN={{ vault_beszel_universal_token }}
    mode: "0600"
  no_log: true

# The agent runs as nobody, so the pair is nobody's. Mounted file by file, so
# the compose template labels the agent with the certificate's hash: a rotated
# pair then recreates the container instead of leaving it on the old inode.
- name: Render the Dozzle agent's TLS pair
  ansible.builtin.copy:
    dest: "/srv/monitoring/dozzle-agent/{{ item.name }}"
    content: "{{ item.content }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  loop:
    - {name: cert.pem, content: "{{ vault_dozzle_agent_certificate }}"}
    - {name: key.pem, content: "{{ vault_dozzle_agent_private_key }}"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# The agent publishes on the tailnet address, which tailscale0 may not hold yet
# when dockerd restores containers at boot; without this the bind fails and the
# agent stays down until something restarts it.
- name: Allow binding the tailnet address before Tailscale assigns it
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-golem-nonlocal-bind.conf
    content: |
      net.ipv4.ip_nonlocal_bind = 1
    mode: "0644"
  notify: Apply the non-local bind setting

- name: Render the monitoring stack
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/monitoring/compose.yml
    mode: "0644"

- name: Deploy the monitoring stack
  community.docker.docker_compose_v2:
    project_src: /srv/monitoring
    state: present
    wait: true

# Kept out of the pager's command line, where any user could read it.
- name: Render the alert relay's authorization header
  ansible.builtin.copy:
    dest: /srv/monitoring/alert-relay.header
    content: |
      Authorization: Bearer {{ vault_dozzle_alert_relay_token }}
    mode: "0600"
  no_log: true

# Dozzle pages golem's containers only while it can see Docker, so it was silent
# for the four days (2026-10-21 to 25) a replaced Docker socket left both proxies
# answering 503: its own agent sat unhealthy and nothing said so. This pages
# what is unhealthy once that has lasted 5 minutes, reading Docker directly. The
# docker role's remount-docker-socket heals that failure within a minute, so it
# pages for what that does not fix.
- name: Install the blind-Dozzle pager
  ansible.builtin.copy:
    src: page-unhealthy-while-dozzle-blind
    dest: /usr/local/sbin/page-unhealthy-while-dozzle-blind
    mode: "0755"

- name: Define the blind-Dozzle pager
  ansible.builtin.copy:
    dest: "/etc/systemd/system/page-unhealthy-while-dozzle-blind.{{ item.unit }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - unit: service
      content: |
        [Unit]
        Description=Page unhealthy containers while golem's Dozzle agent cannot see Docker
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/page-unhealthy-while-dozzle-blind {{ dozzle_alert_relay_url }}
    - unit: timer
      content: |
        [Unit]
        Description=Check every minute whether golem's Dozzle agent is blind

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.unit }}"
  notify: Reload systemd

- name: Enable the blind-Dozzle pager
  ansible.builtin.systemd_service:
    name: page-unhealthy-while-dozzle-blind.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
