# bubblewrap and socat are what Claude Code's Linux sandbox is built on.
# acl lets Ansible become the unprivileged agent user.
- name: Install the agent's tooling
  ansible.builtin.apt:
    name:
      - acl
      - bubblewrap
      - curl
      - gh
      - git
      - jq
      - ripgrep
      - socat
    state: present

# The native binary needs AVX, which this i5-3210M has (it lacks AVX2).
# The installer keeps the binary up to date by itself under ~/.local.
- name: Install Claude Code for the agent
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: "/home/{{ agent_user }}/.local/bin/claude"
  become: true
  become_user: "{{ agent_user }}"

- name: Prove Claude Code runs on this CPU
  ansible.builtin.command: "/home/{{ agent_user }}/.local/bin/claude --version"
  become: true
  become_user: "{{ agent_user }}"
  changed_when: false
  check_mode: false
  register: agent_claude_version

- name: Report the Claude Code version
  ansible.builtin.debug:
    msg: "{{ agent_claude_version.stdout }}"
