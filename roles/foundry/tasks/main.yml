# A template value saved unedited deployed once and crash-looped cloudflared;
# refuse it here instead. The values themselves are never printed.
- name: Refuse placeholder Foundry credentials
  ansible.builtin.assert:
    that:
      - vault_cloudflare_tunnel_token is match('^eyJ[A-Za-z0-9_=-]{40,}$')
      # A token decodes to one JSON object; a pasted extra character after it
      # (seen 2026-09-28) still matches the pattern above but not this.
      - (vault_cloudflare_tunnel_token | b64decode) is match('^\\{.*\\}$')
      - vault_foundry_admin_key | length >= 12
      - vault_foundry_username | length >= 2
      - vault_foundry_password | length >= 6
    fail_msg: >-
      group_vars/all/vault_foundry.yml holds a placeholder or malformed value
      (tunnel token must be exactly the eyJ... token, nothing after it; admin key at least 12 characters).
    quiet: true
  no_log: true

- name: Create the Foundry directory
  ansible.builtin.file:
    path: /srv/foundry
    state: directory
    mode: "0750"

# The image runs Foundry as uid 1000 and aborts if /data is not writable.
- name: Create Foundry's data directory
  ansible.builtin.file:
    path: /srv/foundry/data
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

# The foundryvtt.com login downloads the release and fetches the licence; the
# admin key guards Foundry's /setup page behind Cloudflare Access. The image
# reads this as a Compose secret, as node (uid 1000): Compose ignores a file
# secret's uid and mode outside Swarm, so the file's own owner is what counts.
# to_json, because a quote in the password must not break the entrypoint's jq,
# which on any error carries on without an admin key and leaves /setup open.
- name: Render Foundry's credentials
  ansible.builtin.copy:
    dest: /srv/foundry/config.json
    content: >-
      {{ {'foundry_username': vault_foundry_username,
          'foundry_password': vault_foundry_password,
          'foundry_admin_key': vault_foundry_admin_key} | to_json }}
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true

# Kept apart from config.json so a compromised Foundry never sees the token.
# cloudflared runs as nonroot (uid 65532).
- name: Render the tunnel token
  ansible.builtin.copy:
    dest: /srv/foundry/tunnel-token
    content: "{{ vault_cloudflare_tunnel_token }}"
    owner: "65532"
    group: "65532"
    mode: "0400"
  no_log: true

- name: Render the Foundry stack
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/foundry/compose.yml
    mode: "0644"

- name: Deploy the Foundry stack
  community.docker.docker_compose_v2:
    project_src: /srv/foundry
    state: present

# The environment files the credentials lived in before they became secrets.
- name: Remove the old environment files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /srv/foundry/foundry.env
    - /srv/foundry/.env
